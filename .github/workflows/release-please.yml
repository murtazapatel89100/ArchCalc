name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: pnpm install

      - name: Build Tauri App & Upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./app
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false

      - name: Generate PKGBUILD for AUR
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION=$(grep '"version"' app/src-tauri/tauri.conf.json | head -1 | awk -F '"' '{print $4}')

          # Find the generated deb file so we can hash it
          DEB_FILE=$(find ./app/src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          SHA256=$(sha256sum "$DEB_FILE" | awk '{ print $1 }')

          mkdir -p aur_pkg
          cat << EOF > aur_pkg/PKGBUILD
          pkgname=archcalc
          pkgver=$VERSION
          pkgrel=1
          pkgdesc="Built with precision. The definitive workspace and dev tools platform."
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'cairo' 'pango' 'glib2' 'openssl' 'libayatana-appindicator')
          provides=('archcalc')
          conflicts=('archcalc')
          source=("\$pkgname-\$pkgver.deb::\$url/releases/download/v\$pkgver/archcalc_\${pkgver}_amd64.deb")
          sha256sums=('${SHA256}')

          package() {
            bsdtar -xf "\$srcdir/\$pkgname-\$pkgver.deb" -C "\$srcdir"
            
            # The data tarball might be compressed with different algorithms
            if [ -f "\$srcdir/data.tar.gz" ]; then
              tar -xzf "\$srcdir/data.tar.gz" -C "\$pkgdir"
            elif [ -f "\$srcdir/data.tar.xz" ]; then
              tar -xJf "\$srcdir/data.tar.xz" -C "\$pkgdir"
            elif [ -f "\$srcdir/data.tar.zst" ]; then
              tar -I zstd -xf "\$srcdir/data.tar.zst" -C "\$pkgdir"
            fi
          }
          EOF

      - name: Publish to AUR
        if: matrix.platform == 'ubuntu-22.04'
        uses: KSXGitHub/github-actions-deploy-aur@v4.0.0
        with:
          pkgname: archcalc
          pkgbuild: ./aur_pkg/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_PUBLISHABLE_KEY }}
          commit_message: "Automated Release v${{ github.sha }}"
          updpkgsums: false

      - name: Output Summary (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "## Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Target | Status | Link |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐙 GitHub | Releases | ✅ Built & Attached | [View Release](https://github.com/${{ github.repository }}/releases) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Arch Linux | AUR | ✅ Published | [archcalc](https://aur.archlinux.org/packages/archcalc) |" >> $GITHUB_STEP_SUMMARY

      - name: Output Summary (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          echo "## Deployment Summary :rocket:" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Platform | Target | Status | Link |" >> $env:GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows | Releases | ✅ Built & Attached | [View Release](https://github.com/${{ github.repository }}/releases) |" >> $env:GITHUB_STEP_SUMMARY
